<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EventSync Pro - Register</title>
  <link rel="stylesheet" href="app/css/style.css">
  </head>
  <body>
    <div class="login-container">
      <!-- Header -->
      <div class="login-header">
        <h1 class="app-title">EventSync Pro</h1>
        <p class="app-subtitle">Event Management & Attendance Control</p>
      </div>

      <!-- Register Form -->
      <div class="login-form-container">
        <div class="login-form-card">
          <h2 class="login-title">Register</h2>
          <p class="login-subtitle">Create your attendee account</p>
          <form class="login-form" id="registerForm">
            <!-- Name Field -->
            <div class="form-group">
              <label for="name" class="form-label">Full Name</label>
              <input type="text" id="name" name="name" class="form-input" placeholder="Enter your full name" required>
            </div>
            <!-- Email Field -->
            <div class="form-group">
              <label for="email" class="form-label">Email</label>
              <input type="email" id="email" name="email" class="form-input" placeholder="Enter your email" required>
            </div>
            <!-- Password Field -->
            <div class="form-group">
              <label for="password" class="form-label">Password</label>
              <input type="password" id="password" name="password" class="form-input" placeholder="Create a password" required>
            </div>
            <!-- Register Button -->
            <button type="submit" class="login-button">Register</button>
          </form>
          <!-- Link to Login -->
          <div class="register-link">
            <a href="index.html" class="register-attendee-link">Already have an account? Sign In</a>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
