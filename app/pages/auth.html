<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Auth — QreateFlow</title>

  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/auth.css">
</head>
<body>
  <!-- Header (same as landing, without auth buttons) -->
  <header class="header">
    <div class="container header-inner">
      <a href="landing.html" class="logo" aria-label="QreateFlow home">
        <img src="../assets/icons/QreateFlow-logo-transparent.png" alt="QreateFlow logo" class="logo-img" width="48" height="48">
        <span class="logo-text sr-only">QreateFlow</span>
      </a>
      <!-- nav-actions intentionally omitted on auth page -->
    </div>
  </header>
  <main class="container auth-main">
    <section class="card auth-card">
      <!-- Accessible tab switch (CSS only) -->
      <div class="tabs" role="tablist" aria-label="Auth tabs">
        <input type="radio" name="auth-tab" id="tab-login" checked>
        <input type="radio" name="auth-tab" id="tab-register">
        <div class="tabs-labels">
          <label for="tab-login" role="tab" aria-controls="panel-login">Login</label>
          <label for="tab-register" role="tab" aria-controls="panel-register">Register</label>
        </div>

        <div class="tabs-panels">
          <!-- LOGIN PANEL -->
          <div id="panel-login" class="panel" role="tabpanel" aria-labelledby="tab-login">
            <h3 class="auth-title">Sign in</h3>
            <form id="loginForm" method="post" data-endpoint="/api/auth/login" novalidate>
              <label class="form-label" for="login-email">Email</label>
              <input class="form-input" id="login-email" name="email" type="email" placeholder="you@domain.com" required>

              <label class="form-label" for="login-password">Password</label>
              <input class="form-input" id="login-password" name="password" type="password" placeholder="Your password" required>

              <div class="mt-16">
                <button type="submit" class="btn btn-primary auth-btn">Sign in</button>
              </div>

              <p class="text-muted auth-note">
                Don't have an account? <label for="tab-register" class="link-like auth-cta-link">Register</label>
              </p>
            </form>
          </div>

          <!-- REGISTER PANEL -->
          <div id="panel-register" class="panel" role="tabpanel" aria-labelledby="tab-register">
            <h3 class="auth-title">Create an account</h3>
            <form id="registerForm" method="post" data-endpoint="/api/auth/register" novalidate>
              <label class="form-label" for="reg-name">Full name</label>
              <input class="form-input" id="reg-name" name="name" type="text" placeholder="Your full name" required>

              <label class="form-label" for="reg-email">Email</label>
              <input class="form-input" id="reg-email" name="email" type="email" placeholder="you@domain.com" required>

              <label class="form-label" for="reg-password">Password</label>
              <input class="form-input" id="reg-password" name="password" type="password" placeholder="8+ characters" required minlength="8">

              <label class="form-label" for="confirm-password">Confirm password</label>
              <input class="form-input" id="confirm-password" name="confirm_password" type="password" placeholder="Repeat your password" required minlength="8">

              <div class="mt-16">
                <button type="submit" class="btn btn-primary auth-btn">Create account</button>
              </div>

              <p class="text-muted auth-note">
                Already have an account? <label for="tab-login" class="link-like auth-cta-link">Sign in</label>
              </p>
            </form>
          </div>
        </div>
      </div>

  <p class="auth-back">← Back to <a href="landing.html">homepage</a></p>
    </section>
  </main>
</body>
</html>
